<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Weather</title>
<meta name="description" content="Skyline: a Taiwan weather app mockup with live sky backgrounds, PM2.5 and landslide predictions, and location search.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1B3F'/%3E%3Ccircle cx='20' cy='12' r='6' fill='%23FFC24B'/%3E%3Cpath d='M3 28h26v-4l-4-3-3 2-3-6-3 4-3-3-4 5-3-1-3 2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#FFC24B; --accent-ink:#2A1A00;
  --navy:#0B1B3F; --navy-2:#081430; --panel:#12285A;
  --glass:rgba(8,24,56,.5); --glass-line:rgba(255,255,255,.12);
  --muted:#B8C7E8; --soft:#D5DEF2;
  --light-bg:#F3F6FC; --light-card:#FFFFFF; --light-ink:#0B1B3F; --light-muted:#34466B; --light-line:#E3E9F5;
  --r:24px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
body.system-fonts{--display:system-ui,-apple-system,'Segoe UI',sans-serif;--body:system-ui,-apple-system,'Segoe UI',sans-serif}
body.solid-tiles{--glass:#16306A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:#fff;font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- animation ---------- */
@keyframes sk-drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
@keyframes sk-rain{from{transform:translateY(0)}to{transform:translateY(50%)}}
@keyframes sk-flash{0%,88%,100%{opacity:0}89%{opacity:.9}90%{opacity:.15}92%{opacity:.7}94%{opacity:0}}
@keyframes sk-twinkle{0%,100%{opacity:.85}50%{opacity:.45}}
@keyframes sk-shimmer{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
@keyframes sk-flow{to{stroke-dashoffset:-60}}
@keyframes sk-pulse{0%{r:6;opacity:.8}100%{r:22;opacity:0}}
@keyframes sk-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sk-cloud{animation:sk-drift ease-in-out infinite alternate}
.sk-rain{animation:sk-rain linear infinite}
.sk-flash{animation:sk-flash 7s infinite}
.sk-stars{animation:sk-twinkle 5s ease-in-out infinite}
.sk-flare{animation:sk-shimmer 6s ease-in-out infinite}
.sk-flow{animation:sk-flow 3s linear infinite}
.sk-pulse{animation:sk-pulse 2s ease-out infinite}
body.reduce-motion *, body.reduce-motion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---------- top bar & tab bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:30;color:#fff;height:64px;display:flex;align-items:center;gap:20px;padding:0 28px;background:rgba(8,20,48,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body[data-page=home] .topbar{background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0));backdrop-filter:none;-webkit-backdrop-filter:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;text-decoration:none}
.topnav{display:flex;gap:4px}
.topnav a{padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;color:rgba(255,255,255,.82)}
.topnav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.topnav a[aria-current=page]{background:rgba(255,255,255,.18);color:#fff}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:10px;min-height:44px;min-width:300px;padding:0 8px 0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:14px;text-align:left}
.search-btn:hover{background:rgba(255,255,255,.2)}
.search-btn .sb-text{color:rgba(255,255,255,.85)}
.sb-short{display:none}
kbd{font:600 12px var(--body);padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.16);color:#fff}
.search-btn kbd{margin-left:auto}
.tabbar{display:none}
main{min-height:100vh}

/* ---------- home hero ---------- */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--top) 0%,var(--mid) 34%,var(--bottom) 62%,var(--navy) 86%)}
.sky{position:absolute;left:0;right:0;top:0;height:80%;overflow:hidden;pointer-events:none}
.stars{position:absolute;inset:0 0 40% 0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,rgba(255,255,255,0)),radial-gradient(1px 1px at 90px 120px,#fff,rgba(255,255,255,0)),radial-gradient(1.2px 1.2px at 160px 60px,#fff,rgba(255,255,255,0)),radial-gradient(1px 1px at 230px 170px,#DDE6FF,rgba(255,255,255,0)),radial-gradient(2px 2px at 300px 40px,#fff,rgba(255,255,255,0));background-size:340px 220px}
.moon{position:absolute;left:74%;top:120px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFFDF4 0%,#ECE7D6 55%,#CFC8B2 100%);box-shadow:0 0 60px 20px rgba(230,235,255,.25),0 0 180px 60px rgba(160,180,255,.12)}
.sun-glow{position:absolute;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%}
.sun{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%}
.streak{position:absolute;width:1400px;height:4px;margin:-2px 0 0 -700px;background:linear-gradient(90deg,rgba(180,220,255,0),rgba(200,230,255,.55) 45%,rgba(255,255,255,.8) 50%,rgba(200,230,255,.55) 55%,rgba(180,220,255,0));filter:blur(1.5px)}
.flare-ghost,.cloud{position:absolute;border-radius:50%}
.cloud{border-radius:0}
.wx-back{position:absolute;inset:0;width:100%;height:100%}
.wx-front{position:absolute;left:0;top:0;width:100%;z-index:2;pointer-events:none}
.rain-wrap{position:absolute;inset:0;transform:rotate(10deg) scale(1.2)}
.rain1,.rain2{position:absolute;left:0;right:0;top:-100%;height:200%}
.rain1{animation-duration:.9s;background-image:repeating-linear-gradient(90deg,rgba(200,220,255,0) 0 17px,rgba(200,220,255,.35) 17px 18px,rgba(200,220,255,0) 18px 41px);-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 46px,transparent 46px 130px);mask-image:repeating-linear-gradient(180deg,#000 0 46px,transparent 46px 130px)}
.rain2{left:7px;animation-duration:.55s;background-image:repeating-linear-gradient(90deg,rgba(220,235,255,0) 0 29px,rgba(220,235,255,.55) 29px 31px,rgba(220,235,255,0) 31px 67px);-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 70px,transparent 70px 210px);mask-image:repeating-linear-gradient(180deg,#000 0 70px,transparent 70px 210px)}
.flash{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(235,240,255,.85),rgba(200,210,255,.25) 50%,rgba(200,210,255,0) 80%)}
.bolt{position:absolute;left:26%;top:60px;filter:drop-shadow(0 0 10px #CFD8FF) drop-shadow(0 0 30px #9FB2FF)}

.hero-main{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:96px 24px 8px;text-align:center}
.hero-main::before{content:"";position:absolute;left:50%;top:54%;width:min(980px,120%);height:min(520px,90%);transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(8,22,52,.26),rgba(8,22,52,.12) 55%,rgba(8,22,52,0));z-index:-1;pointer-events:none}
.loc{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(8,24,56,.46);color:#fff;font-size:20px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.loc:hover{background:rgba(8,24,56,.6)}
.loc .loc-sub{font-weight:500;opacity:.88;font-size:16px}
.temp{font-family:var(--display);font-weight:800;font-size:clamp(132px,15vw,210px);line-height:.92;letter-spacing:-.04em;margin-left:.08em;text-shadow:0 2px 6px rgba(0,0,0,.18),0 6px 40px rgba(0,0,0,.22)}
.headline{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.2vw,28px);text-shadow:0 1px 3px rgba(0,0,0,.4),0 2px 18px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:rgba(8,24,56,.42);font-size:13px;font-weight:600;color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.chip.warn{background:rgba(255,194,75,.2);color:#FFE4A8}
.demo{position:absolute;z-index:2;right:24px;top:76px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:14px;background:rgba(8,24,56,.42);font-size:12px;font-weight:600;color:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.demo select{min-height:32px;border-radius:9px;border:0;padding:0 8px;background:rgba(255,255,255,.16);color:#fff}
.demo select option{color:#0B1B3F}
.skyline{position:relative;display:block;width:100%;height:clamp(120px,15vw,220px);margin-top:4px}
.hilo{display:flex;gap:16px;font-size:clamp(17px,1.6vw,21px);font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.4),0 2px 14px rgba(0,0,0,.3)}
.days{width:100%;max-width:1200px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:6px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:14px;white-space:nowrap}
.day:first-child{background:rgba(255,255,255,.12)}
.day .dn{font-weight:600}
.day .ic{flex:none;width:12px;height:12px;border-radius:50%}
.day .dh{font-weight:700;font-size:15px}
.day .dl{color:var(--muted)}
.pinned-wrap{position:relative;z-index:1;background:var(--navy);padding:8px 40px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pinned{width:100%;max-width:1200px;display:grid;gap:16px}
.pinned.few{grid-template-columns:repeat(3,minmax(0,1fr))}
.pinned.many{grid-template-columns:repeat(5,minmax(0,1fr))}
.pin{padding:18px 20px;border-radius:var(--r);background:var(--glass);border:1px solid var(--glass-line);display:flex;flex-direction:column;gap:4px;min-width:0}
.pin .t{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pin .v{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05}
.pinned.many .pin .v{font-size:28px}
.pin .s{font-size:14px;color:var(--soft)}
.pin .src{font-size:12px;color:var(--muted)}
.scroll-hint{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;font-weight:600}
.scroll-hint:hover{background:rgba(255,255,255,.1)}

/* ---------- stats grid ---------- */
.stats{max-width:1280px;margin:0 auto;padding:56px 40px 80px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:64px}
.stats-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.stats-head h2{font-family:var(--display);font-weight:800;font-size:40px}
.stats-head p{margin:4px 0 0;color:var(--soft);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.edit-tip{margin:0;padding:12px 16px;border-radius:14px;background:rgba(255,194,75,.14);color:#FFE4A8;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(176px,auto);gap:16px;grid-auto-flow:dense}
.tile{position:relative;min-width:0;padding:20px 22px;border-radius:var(--r);background:var(--tbg,var(--glass));color:var(--tfg,#fff);border:1px solid var(--glass-line);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
.r2{grid-row:span 2}
.grid.editing .tile{border:2px dashed rgba(255,255,255,.6);cursor:grab}
.tile.dragging{opacity:.4}
.tile.drop-target{outline:3px solid var(--accent);outline-offset:2px}
.tile header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tile h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.85}
.tile .src{font-size:12px;opacity:.7;text-align:right}
.tile .val{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05}
.tile .sub{margin:0;font-size:14px;line-height:1.45;opacity:.9}
.meter{position:relative;height:8px;border-radius:4px;margin-top:auto}
.meter span{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.hour{flex:1 0 72px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;border-radius:16px;font-size:14px}
.hour:first-child{background:rgba(255,255,255,.1)}
.hour .ic{width:26px;height:26px;border-radius:50%}
.hour .tt{font-weight:700;font-size:18px}
.hour .rp{font-size:12px;color:#7DD3FC}
.week{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:64px 22px 40px 1fr 40px;align-items:center;gap:10px;min-height:44px;border-top:1px solid rgba(255,255,255,.1);font-size:15px}
.wrow:first-child{border-top:0}
.wrow .ic{width:18px;height:18px;border-radius:50%}
.wrow .lo{opacity:.7;text-align:right}
.wbar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.wbar span{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7DD3FC,#FFC24B,#FB923C)}
.tile-map{position:relative;flex:1;min-height:200px;margin:0 -22px -20px;overflow:hidden}
.tile-map svg,.tile-map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.grid.editing .tile-map iframe{pointer-events:none}
.tile-map .open{position:absolute;left:12px;top:12px;min-height:36px;padding:0 14px;font-size:13px}
.edit-ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.edit-ctl button{min-width:40px;min-height:40px;padding:0 10px;border-radius:12px;border:0;background:#fff;color:#0B1B3F;font-weight:600;font-size:13px}
.edit-ctl button.hide{background:#FF6B5A;color:#fff}
.edit-ctl button:disabled{opacity:.4;cursor:not-allowed}
.hidden-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--soft)}
.hidden-row button{min-height:40px;padding:0 14px;border-radius:999px;border:1px dashed rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:600}
.foot{margin:0;font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- pages ---------- */
.page{max-width:1280px;margin:0 auto;padding:96px 40px 80px;display:flex;flex-direction:column;gap:28px;animation:sk-in .25s ease-out}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.page h1{font-family:var(--display);font-weight:800;font-size:48px;line-height:1.05}
.lede{margin:6px 0 0;font-size:16px;color:var(--soft);max-width:720px;line-height:1.5}
.banner{padding:14px 18px;border-radius:16px;background:rgba(255,194,75,.14);color:#FFE4A8;font-size:14px;line-height:1.5}
.group-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.group-head h2{font-family:var(--display);font-weight:800;font-size:26px}
.group-head span{color:var(--muted);font-size:14px}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);text-decoration:none;overflow:hidden;border:1px solid var(--glass-line);transition:transform .15s}
.pcard:hover{transform:translateY(-3px)}
.pcard.own{border:2px solid var(--accent)}
.thumb{position:relative;height:180px;background:#05172E}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.base-tag{position:absolute;left:10px;bottom:10px;padding:4px 10px;border-radius:999px;background:rgba(5,23,46,.78);font-size:12px;font-weight:600}
.own-tag{position:absolute;right:10px;top:10px;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700}
.pc-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.pc-body h3{font-family:var(--display);font-weight:700;font-size:20px}
.pc-body p{margin:0;font-size:14px;color:var(--soft);line-height:1.45}
.pc-body .src{font-size:12px;color:var(--muted)}
.pm-head{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.pm-head h1{font-size:40px}
.pm-head .grow{flex:1}
.chip.solid{background:rgba(255,255,255,.14);backdrop-filter:none}
.chip.own{background:var(--accent);color:var(--accent-ink)}
.pm-body{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pm-map{flex:3 1 520px;min-width:0;padding:22px;border-radius:28px;background:var(--panel);display:flex;flex-direction:column;gap:18px}
.map-box{position:relative;overflow:hidden;border-radius:20px;background:#05172E;height:clamp(420px,62vh,660px)}
.pm-live,.leaflet-host,.windy-frame{position:absolute;inset:0;width:100%;height:100%;border:0}
.map-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.map-note{margin:-6px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.map-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.data-pane svg{filter:blur(14px)}
.leaflet-container{background:#05172E;font-family:var(--body)}
.leaflet-tooltip.map-label{background:rgba(5,23,46,.82);color:#fff;border:0;border-radius:8px;box-shadow:none;font-weight:600;font-size:12px;padding:3px 7px}
.leaflet-tooltip.map-label::before{display:none}
.map-top{position:absolute;left:14px;top:14px;right:14px;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.mode{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:rgba(5,23,46,.75)}
.seg button{min-height:36px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:#fff;font-weight:600;font-size:13px}
.seg button[aria-pressed=true]{background:#fff;color:#0B1B3F}
.slider label{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.slider label .now{color:var(--accent)}
input[type=range].time{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,#5B6F99 0 36.4%,var(--accent) 36.4% 100%);margin:10px 0}
input[type=range].time::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range].time::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.ticks{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font-size:11px;color:var(--muted);text-align:center}
.ticks .is-now{color:#fff;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:block;width:14px;height:14px;border-radius:4px}
.pm-side{flex:2 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.note{padding:22px 24px;border-radius:24px;background:#fff;color:#0B1B3F;display:flex;flex-direction:column;gap:8px}
.note .k{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#4A5A7A}
.note p{margin:0;font-size:15px;line-height:1.5}
.note .conf{font-size:13px;font-weight:600;color:#34466B}
.regions{padding:12px 24px;border-radius:24px;background:var(--panel)}
.region{display:flex;justify-content:space-between;align-items:center;min-height:46px;border-top:1px solid rgba(255,255,255,.1);font-size:15px}
.region:first-child{border-top:0}
.region b{padding:4px 10px;border-radius:8px;font-size:13px}
.region.you span::after{content:" · you";color:var(--accent);font-weight:600}

/* ---------- light pages ---------- */
body[data-page=ask], body[data-page=settings]{background:var(--light-bg);color:var(--light-ink);color-scheme:light}
.light .lede{color:var(--light-muted)}
.light .eyebrow{color:#1E5BC6}
.card{padding:22px 24px;border-radius:var(--r);background:var(--light-card);box-shadow:0 2px 12px rgba(11,27,63,.05);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:18px;font-weight:700}
.card .hint{margin:0;font-size:14px;color:var(--light-muted)}
.chat{display:flex;flex-direction:column;gap:14px;max-width:860px}
.msg{max-width:80%;padding:14px 16px;font-size:15px;line-height:1.5}
.msg.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:#1E5BC6;color:#fff}
.msg.ai{align-self:flex-start;max-width:88%;border-radius:20px 20px 20px 6px;background:#fff;box-shadow:0 2px 10px rgba(11,27,63,.06);display:flex;flex-direction:column;gap:10px}
.msg.ai p{margin:0}
.msg.typing{color:var(--light-muted);font-style:italic}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs span{padding:4px 10px;border-radius:999px;background:#E8EEFA;color:#1E3C7A;font-size:12px;font-weight:600}
.srcs span.own{background:#FFF4E0;color:#7A3A00}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--light-muted)}
.bars i{display:block;width:100%;border-radius:5px}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #C5D2EC;background:#fff;color:#0B1B3F;font-weight:500;font-size:14px}
.suggest button:hover{border-color:#1E5BC6}
.ask-form{position:sticky;bottom:16px;max-width:860px;display:flex;gap:8px;padding:6px;border-radius:18px;background:#fff;box-shadow:0 4px 20px rgba(11,27,63,.12)}
.ask-form input{flex:1;min-width:0;min-height:48px;padding:0 12px;border:0;outline:none;background:transparent;color:#0B1B3F;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field .lbl{font-size:14px;font-weight:600}
.field .lbl small{font-weight:400;color:var(--light-muted)}
.field input[type=text],.field input[type=url],.field input[type=password]{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid #C5D2EC;background:#fff;color:#0B1B3F;font-size:15px;width:100%}
.row-in{display:flex;gap:8px}
.row-in input{flex:1;min-width:0}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #C5D2EC;background:#fff;color:#0B1B3F;font-size:13px;font-weight:600}
.chip-btn[aria-pressed=true]{background:#0B1B3F;color:#fff;border-color:#0B1B3F}
.ai-status:empty{display:none}
.ai-status{padding:10px 12px;border-radius:10px;background:#EEF3FC;color:#0B1B3F}
.code{position:relative}
.code pre{margin:0;padding:12px 14px;padding-right:84px;border-radius:12px;background:#0B1B3F;color:#E3EAF8;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.code .light-btn{position:absolute;right:8px;top:8px;min-height:32px;padding:0 10px;font-size:13px}
.msg .err{color:#B42318}
.msg .thinking{color:var(--light-muted);font-style:italic}
.msg code{font:13px ui-monospace,Menlo,monospace;background:#EEF3FC;padding:1px 5px;border-radius:5px}
.ai-using{margin-top:2px;font-size:14px}
.ask-form button{min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:52px;border-top:1px solid var(--light-line);font-size:15px}
.set-row:first-of-type{border-top:0}
.set-row .lbl{display:flex;flex-direction:column}
.set-row .lbl small{color:var(--light-muted);font-size:13px}
.light .seg{background:#E8EEFA}
.light .seg button{color:#0B1B3F}
.light .seg button[aria-pressed=true]{background:#0B1B3F;color:#fff}
.switch{position:relative;flex:none;width:50px;height:30px;border-radius:999px;border:0;background:#C5D2EC;padding:0}
.switch::before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked=true]{background:#1E5BC6}
.switch[aria-checked=true]::before{transform:translateX(20px)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatch[aria-pressed=true]{border-color:#0B1B3F}
.swatches input[type=color]{width:44px;height:44px;border:1px dashed #4A5A7A;border-radius:50%;padding:2px;background:#fff}
.badge{padding:3px 10px;border-radius:999px;background:#E8EEFA;font-size:12px;font-weight:700}
.badge.custom{background:#FFF4E0;color:#7A3A00}
.pins-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pins-list li{display:flex;align-items:center;gap:10px;min-height:46px;border-top:1px solid var(--light-line);font-size:15px}
.pins-list li.off{color:#8090AE}
.pins-list .n{width:26px;height:26px;border-radius:50%;background:#E8EEFA;display:grid;place-items:center;font-size:12px;font-weight:700}
.pins-list li.off .n{background:transparent;border:1px dashed #C5D2EC}
.pins-list .grow{flex:1}
.mini{min-width:36px;min-height:36px;border-radius:10px;border:1px solid #C5D2EC;background:#fff;color:#0B1B3F;font-weight:700}
.mini:disabled{opacity:.35}
.light-btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #C5D2EC;background:#fff;color:#0B1B3F;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.light-btn.primary{background:#0B1B3F;color:#fff;border-color:#0B1B3F}
input[type=range].plain{width:100%;accent-color:#1E5BC6}
.light a.link{color:#1E5BC6;font-weight:600}

/* ---------- search ---------- */
.search-overlay{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px;background:rgba(4,10,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.search-overlay[hidden]{display:none}
.search-panel{width:100%;max-width:640px;max-height:80vh;display:flex;flex-direction:column;border-radius:24px;background:#fff;color:#0B1B3F;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden;animation:sk-in .18s ease-out;color-scheme:light}
.search-field{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--light-line)}
.search-field input{flex:1;min-width:0;min-height:44px;border:0;outline:none;font-size:18px;background:transparent;color:#0B1B3F}
.search-field kbd{background:#E8EEFA;color:#34466B}
.search-field .close{min-width:44px;min-height:44px;border:0;border-radius:12px;background:#F3F6FC;font-size:15px;font-weight:600;color:#0B1B3F}
.search-body{overflow-y:auto;padding:10px}
.s-label{padding:10px 10px 6px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#4A5A7A}
.examples{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.examples button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #C5D2EC;background:#fff;color:#0B1B3F;font-size:13px}
.examples button b{font-weight:600}
.results{list-style:none;margin:0;padding:0}
.res{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer;min-height:56px}
.res[aria-selected=true],.res:hover{background:#EEF3FC}
.res .ico{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#E8EEFA;color:#1E3C7A}
.res .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.res .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .sb{font-size:13px;color:#4A5A7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tag{flex:none;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#E8EEFA;color:#1E3C7A}
.tag.k-coords{background:#E6F7EE;color:#0E6B3A}
.tag.k-iata,.tag.k-icao,.tag.k-airport{background:#EEE8FF;color:#4B2FA8}
.tag.k-university{background:#FFF4E0;color:#7A3A00}
.tag.k-district{background:#E0F2FE;color:#075985}
.res.note-row{cursor:default;color:#4A5A7A;font-size:14px}
.res.note-row:hover{background:transparent}
.s-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-top:1px solid var(--light-line)}
.s-actions button{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid #C5D2EC;background:#fff;color:#0B1B3F;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:28px;z-index:60;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:#0B1B3F;color:#fff;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15)}
.toast[hidden]{display:none}

/* ---------- mobile ---------- */
@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .s3,.s4{grid-column:span 2}
  .settings-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .topbar{height:56px;padding:0 16px}
  .topnav{display:none}
  .search-btn{min-width:0;min-height:40px;padding:0 12px}
  .search-btn .sb-text{display:none}
  .sb-short{display:inline;font-weight:600}
  .search-btn kbd{display:none}
  .tabbar{color:#fff;display:grid;position:fixed;inset:auto 0 0 0;z-index:30;grid-template-columns:repeat(4,minmax(0,1fr));height:78px;padding:6px 6px 20px;background:var(--navy);border-top:1px solid rgba(255,255,255,.08)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;text-decoration:none;color:#fff}
  .tabbar a[aria-current=page]{color:var(--accent)}
  main{padding-bottom:78px}
  .hero{min-height:calc(100vh - 78px)}
  .hero-main{padding:112px 16px 4px}
  .loc{font-size:17px;max-width:100%;white-space:nowrap}.loc>span:not(.loc-sub){flex:none}.loc .loc-sub{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .temp{font-size:124px}
  .headline{font-size:20px}
  .demo{left:50%;right:auto;top:64px;transform:translateX(-50%);white-space:nowrap}
  .pinned-wrap{padding:4px 16px 20px}
  .days{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px}
  .day{flex:0 0 auto;scroll-snap-align:start;padding:6px 10px;gap:5px;font-size:13px}
  .pinned{gap:10px}
  .pinned.few{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pinned.many{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pin{padding:14px;border-radius:calc(var(--r) - 6px)}
  .pin .v{font-size:26px}.pinned.many .pin .v{font-size:24px}
  .pin .s{font-size:12px}.pin .src{display:none}
  .stats{padding:36px 16px 40px}
  .stats-head h2{font-size:30px}
  .grid{gap:12px;grid-auto-rows:minmax(150px,auto)}
  .tile{padding:16px;border-radius:calc(var(--r) - 4px)}
  .tile .val{font-size:30px}
  .tile .src{display:none}
  .s2,.s3,.s4{grid-column:span 2}
  .wrow{grid-template-columns:52px 18px 34px 1fr 34px;gap:8px;font-size:14px}
  .page{padding:76px 16px 40px;gap:20px}
  .page h1{font-size:34px}
  .pm-head h1{font-size:28px}
  .pm-map{padding:12px;border-radius:22px}
  .map-box{height:460px}
  .ticks{font-size:9px}
  .ticks span:nth-child(odd):not(.is-now){visibility:hidden}
  .msg{max-width:90%}
  .ask-form{bottom:94px}
  .search-overlay{padding:0;align-items:stretch}
  .search-panel{max-width:none;max-height:none;border-radius:0}
  .toast{bottom:96px}
}

    .replace(/臺/g, '台').replace(/[.,'’\-–()]/g, ' ').replace(/\s+/g, ' ').trim();
}

function addPlace(kind, name, aliases, lat, lon, sub, extra) {
  // Keys: the full name, plus each space-separated alias (abbreviations, 中文 names, codes)
  var keys = [norm(name)];
  String(aliases || '').split(/\s+/).forEach(function (w) { if (w) keys.push(norm(w)); });
  var p = { id: kind + ':' + name, kind: kind, name: name, sub: sub, lat: lat, lon: lon, keys: keys.filter(Boolean) };
  if (extra) for (var k in extra) p[k] = extra[k];
  PLACES.push(p);
  return p;
}

function nearestMapPlace() {
  var y = project(S.loc), bi = 0, bd = Infinity;
  MAP_PLACES.forEach(function (p, i) { var d = Math.hypot(p.x - y.x, p.y - y.y); if (d < bd) { bd = d; bi = i; } });
  return bi;
}

/* ---------- Ask AI ---------- */
function bars(levels, labels) {
  var P = pal(), max = 4;
  return '<div class="bars" role="img" aria-label="' + esc(labels.map(function (l, i) { return l + ': ' + ['low', 'medium', 'high', 'very high'][levels[i]]; }).join(', ')) + '">' +
    levels.map(function (l, i) { return '<div><i style="height:' + ((l + 1) / max * 100) + '%;background:' + P[l] + '"></i>' + labels[i] + '</div>'; }).join('') + '</div>';
}
function answer(q) {
  var l = q.toLowerCase(), L = S.loc, b = WEATHER[S.weather], src = nearestSource(L);
  var tw = inTW(L.lat, L.lon);
  if (/landslide|slope|suhua|highway|road|drive|hike|trail|山崩|土石流/.test(l)) return {
    text: tw ? 'Saturday is the risky day: heavy rain pushes landslide risk to <strong>High</strong> on eastern slopes. Sunday after 10 AM it drops to <strong>Medium</strong>. If you can, go Sunday afternoon.' : 'The landslide model only covers Taiwan, so I can’t rate slopes near ' + esc(L.name) + '.',
    bars: tw ? [[1, 1, 2, 3, 3, 2, 1, 0], ['Fri', 'PM', 'Sat', 'PM', 'Night', 'Sun', 'PM', 'Mon']] : null,
    src: ['CWA rain gauges', 'Windy · precip', '★Landslide model'] };
  if (/pm|air|haze|aqi|smog|空氣/.test(l)) return {
    text: tw ? 'PM2.5 near ' + esc(L.name) + ' is <strong>Moderate (18 µg/m³)</strong> and peaks around 9 PM at about 30 µg/m³. It clears by tomorrow morning as the northeast monsoon picks up.' : 'The team PM2.5 model covers Taiwan only. Windy CAMS puts PM2.5 near ' + esc(L.name) + ' in the moderate range (sample value).',
    bars: [[0, 1, 1, 2, 1, 0], ['Now', '6 PM', '8 PM', '9 PM', '11 PM', '6 AM']],
    src: tw ? ['★PM2.5 model', 'Windy CAMS pm2p5'] : ['Windy CAMS pm2p5'] };
  if (/typhoon|颱風/.test(l)) return {
    text: 'There’s one system to watch: sample storm <strong>TD-27</strong>, about 860 km southeast and moving northwest. CWA could issue a sea warning in about 48 hours. The east coast would feel it first.',
    bars: null, src: ['CWA typhoon warnings', 'Windy · wind, waves'] };
  if (/thunder|storm|lightning|hail|雷/.test(l)) return {
    text: 'Storm energy is high this afternoon (CAPE 2,400 J/kg). Thunderstorms are <strong>likely from 4 to 7 PM</strong>, and hail is possible on Saturday (Windy warning code 96).',
    bars: [[0, 1, 2, 3, 3, 1], ['2 PM', '3 PM', '4 PM', '5 PM', '6 PM', '7 PM']], src: ['Windy · CAPE', 'Windy · weatherWarnings'] };
  if (/rain|umbrella|wet|下雨|雨/.test(l)) return {
    text: 'Bring an umbrella. About <strong>32 mm</strong> of rain is expected today, most of it between 4 and 7 PM.',
    bars: [[0, 0, 1, 3, 3, 2, 1], ['2 PM', '3 PM', '4 PM', '5 PM', '6 PM', '7 PM', '8 PM']], src: ['Windy · precip', src.name] };
  return {
    text: 'Right now in ' + esc(L.name) + ' it’s <strong>' + fmtT(b.temp + tempOffset(L)) + '</strong>: ' + esc(b.headline) + '. Reading from ' + esc(src.name) + '. Ask me about PM2.5, landslide risk, thunderstorms, typhoons or rain.',
    bars: null, src: [src.name, 'Windy point forecast'] };
}
function seedChat() {
  return [{ me: true, text: 'Safe to drive Suhua Highway this weekend?' }, Object.assign({ me: false }, answer('suhua highway'))];
}
function msgHTML(m) {
  if (m.me) return '<div class="msg me">' + esc(m.text) + '</div>';
  if (m.llm) return '<div class="msg ai' + (m.live ? ' live' : '') + '">' +
    (m.error ? '<p class="err">' + esc(m.error) + ' <a class="link" href="#settings">Check settings</a></p>'
             : '<p class="body">' + (m.plain ? mdLite(m.plain) : (m.live ? '<span class="thinking">Thinking…</span>' : '')) + '</p>') +
    '<div class="srcs">' + m.src.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div></div>';
  if (m.typing) return '<div class="msg ai typing">Checking the nearest sources…</div>';
  return '<div class="msg ai"><p>' + m.text + '</p>' + (m.bars ? bars(m.bars[0], m.bars[1]) : '') +
    '<div class="srcs">' + m.src.map(function (s) { return s.charAt(0) === '★' ? '<span class="own">' + esc(s.slice(1)) + '</span>' : '<span>' + esc(s) + '</span>'; }).join('') + '</div></div>';
}
function askView() {
  if (!chat) chat = seedChat();
  var sugg = ['PM2.5 tonight?', 'Typhoon outlook', 'Will it storm this afternoon?', 'Do I need an umbrella?', 'Landslide risk on Highway 8'];
  return '<div class="page light"><header><div class="eyebrow">RAG + MCP over our data</div><h1>Ask Skyline</h1>' +
    '<p class="lede">Answers are grounded in CWA stations, Windy and the team’s PM2.5 and landslide models, for ' + esc(S.loc.name) + '.</p>' +
    '<p class="lede ai-using">Answering with: <strong>' + esc(aiLabel()) + '</strong> · <a class="link" href="#settings">Change</a></p></header>' +
    '<div class="chat" id="chat" aria-live="polite">' + chat.map(msgHTML).join('') + '</div>' +
    '<div class="suggest">' + sugg.map(function (s) { return '<button type="button" data-action="ask" data-q="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div>' +
    '<form class="ask-form" id="ask-form"><label for="ask-input" class="sr-only">Ask a question</label><input id="ask-input" type="text" placeholder="Ask about Taiwan weather…" autocomplete="off"><button type="submit" id="ask-btn">' + (aiAbort ? 'Stop' : 'Ask') + '</button></form></div>';
}
function ask(q) {
  q = q.trim(); if (!q) return;
  if (aiAbort) return;
  if (S.ai.provider !== 'demo') {
    var btn = $('#ask-btn'); if (btn) btn.textContent = 'Stop';
    llmAsk(q).then(function () { var b2 = $('#ask-btn'); if (b2) b2.textContent = 'Ask'; });
    return;
  }
  chat.push({ me: true, text: q }, { typing: true });
  renderChat();
  setTimeout(function () {
    chat.pop(); chat.push(Object.assign({ me: false }, answer(q)));
    renderChat();
  }, 700);
}
function renderChat() {
  var c = $('#chat'); if (!c) return;
  c.innerHTML = chat.map(msgHTML).join('');
  var last = c.lastElementChild; if (last) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ============================================================
   Bring-your-own AI for Ask Skyline.
   - Demo: canned answers (no network).
   - OpenAI-compatible: any /v1/chat/completions server (OpenAI, OpenRouter,
     Ollama, LM Studio, vLLM...), streamed with fetch + SSE.
   - Claude: the official Anthropic TypeScript SDK, loaded from a CDN on first use.
   Keys live only in this browser (memory, or localStorage if "Remember" is on)
   and are sent only to the provider the user picked.
   ============================================================ */
var AI_KEYS_STORE = 'skyline-ai-keys-v1';
var AI_KEYS = { openai: '', claude: '' };
try { var savedKeys = JSON.parse(localStorage.getItem(AI_KEYS_STORE) || 'null'); if (savedKeys) { AI_KEYS.openai = savedKeys.openai || ''; AI_KEYS.claude = savedKeys.claude || ''; } } catch (e) {}
function saveKeys() {
  try {
    if (S.ai.remember) localStorage.setItem(AI_KEYS_STORE, JSON.stringify(AI_KEYS));
    else localStorage.removeItem(AI_KEYS_STORE);
  } catch (e) {}
}
var OA_PRESETS = [
  ['OpenAI', 'https://api.openai.com/v1'],
  ['OpenRouter', 'https://openrouter.ai/api/v1'],
  ['Ollama (local)', 'http://localhost:11434/v1'],
  ['LM Studio (local)', 'http://localhost:1234/v1']
];
var CLAUDE_SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm';
// Models that accept server-side refusal fallbacks ("default" routing by refusal category)
var CLAUDE_FALLBACK_MODELS = ['claude-opus-5-5', 'claude-opus-5', 'claude-sonnet-5-5', 'claude-fable-5-2', 'claude-fable-5-1'];
var AnthropicSDK = null, aiAbort = null, aiModels = [];

function aiLabel() {
  if (S.ai.provider === 'openai') return (S.ai.oaModel || 'no model set') + ' via ' + hostOf(S.ai.oaBase);
  if (S.ai.provider === 'claude') return 'Claude · ' + (S.ai.claudeModel || 'claude-opus-5-5');
  return 'Demo answers';
}
function hostOf(u) { try { return new URL(u).host; } catch (e) { return u || 'no URL set'; } }

// Everything the model may use: the same (sample) data the screens show, for the current location.
function skylineContext() {
  var L = S.loc, src = nearestSource(L), b = WEATHER[S.weather] || WEATHER['partly-cloudy'], off = tempOffset(L);
  var cat = catalog(L), lines = [];
  lines.push('Location: ' + L.name + (L.sub ? ' (' + L.sub + ')' : '') + ' at ' + fmtCoord(L.lat, L.lon) + (inTW(L.lat, L.lon) ? '' : ' — outside Taiwan: team models and prediction maps do not cover it'));
  lines.push('Nearest source for current conditions: ' + src.name + (src.dist ? ' (' + src.dist + ')' : ''));
  lines.push('Now: ' + fmtT(b.temp + off) + ', ' + b.label + '. Headline: ' + b.headline);
  lines.push('Today: high ' + fmtT(todayHL(L).hi) + ', low ' + fmtT(todayHL(L).lo));
  cat.forEach(function (t) {
    if (t.kind === 'stat') lines.push('- ' + t.title + ': ' + t.value + ' — ' + t.sub + ' [source: ' + t.src + ']');
    if (t.kind === 'hourly') lines.push('- Hourly: ' + t.hours.map(function (h) { return h.t + ' ' + h.temp + ' rain ' + h.rain; }).join('; ') + ' [source: ' + t.src + ']');
    if (t.kind === 'week') lines.push('- 7-day forecast (low–high): ' + t.week.map(function (w) { return w.day + ' ' + w.lo + '–' + w.hi; }).join('; '));
    if (t.kind === 'typhoon') lines.push('- Typhoon watch: sample storm TD-27, 860 km SE, moving NW at 18 km/h; sea warning possible in ~48h [source: CWA typhoon warnings]');
  });
  lines.push('Taiwan prediction maps (region levels now / +24h / +72h):');
  activeSets().forEach(function (d) {
    var at = function (t) { return MAP_PLACES.map(function (p, i) { return p.name + ' ' + d.labels[lvlAt(d, i, t)]; }).join(', '); };
    lines.push('- ' + d.title + ' [' + d.src + ']: now: ' + at(NOW) + ' | +24h: ' + at(7) + ' | +72h: ' + at(9) + '. Note: ' + d.note);
  });
  return 'You are Skyline, a weather assistant for Taiwan inside a hackathon app. Answer using only the data in <skyline_data>. ' +
    'If the data does not cover the question, say so plainly instead of guessing. Name the source for each fact (for example "CWA station", "Windy", "team PM2.5 model"). ' +
    'Keep answers short and practical: two to five sentences, plain text, no headings. Reply in the language the user writes in (English or Traditional Chinese). ' +
    'Temperatures are in °' + S.units + '. This is a mockup, so every value is sample data; mention that only if the user asks how reliable the numbers are.\n\n' +
    '<skyline_data>\n' + lines.join('\n') + '\n</skyline_data>';
}

// Conversation so far, as alternating user/assistant text (skips failed turns).
function chatHistory() {
  var out = [];
  for (var i = 0; i < chat.length; i++) {
    var m = chat[i];
    if (m.typing || m.error || m.live) continue;
    var text = m.me ? m.text : (m.plain || stripHTML(m.text));
    if (!text) continue;
    var role = m.me ? 'user' : 'assistant';
    if (out.length && out[out.length - 1].role === role) out[out.length - 1].content += '\n\n' + text;
    else out.push({ role: role, content: text });
  }
  while (out.length && out[0].role !== 'user') out.shift();
  return out.slice(-12);
}
function stripHTML(h) { var d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent || ''; }

// Minimal, safe markdown: escape first, then **bold**, `code`, line breaks and "- " bullets.
function mdLite(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^[-•] (.*)$/gm, '• $1').replace(/\n/g, '<br>');
}

async function streamOpenAI(messages, system, onDelta, signal) {
  var base = (S.ai.oaBase || '').replace(/\/+$/, '');
  if (!base) throw new Error('Set a base URL in Settings → AI assistant.');
  if (!S.ai.oaModel) throw new Error('Pick a model in Settings → AI assistant.');
  var headers = { 'Content-Type': 'application/json' };
  if (AI_KEYS.openai) headers.Authorization = 'Bearer ' + AI_KEYS.openai;
  var res;
  try {
    res = await fetch(base + '/chat/completions', { method: 'POST', headers: headers, signal: signal,
      body: JSON.stringify({ model: S.ai.oaModel, stream: true, messages: [{ role: 'system', content: system }].concat(messages) }) });
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    throw new Error('Couldn’t reach ' + hostOf(base) + '. A local server (Ollama, LM Studio) has to allow this page’s origin, e.g. OLLAMA_ORIGINS=' + location.origin + '. Some providers also block requests made straight from a browser.');
  }
  if (!res.ok) {
    var body = ''; try { body = await res.text(); } catch (e2) {}
    var msg = body; try { var j = JSON.parse(body); msg = (j.error && (j.error.message || j.error)) || j.message || body; } catch (e3) {}
    var known = { 401: 'The API key was rejected', 403: 'Access denied', 404: 'Not found (check the base URL and model)', 429: 'Rate limited or out of credit' }[res.status];
    throw new Error((known || 'Error ' + res.status) + ': ' + String(msg).slice(0, 200));
  }
  var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
  for (;;) {
    var r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, { stream: true });
    var lines = buf.split('\n'); buf = lines.pop();
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.indexOf('data:') !== 0) continue;
      var data = line.slice(5).trim();
      if (data === '[DONE]') return;
      var j2; try { j2 = JSON.parse(data); } catch (e4) { continue; }
      if (j2.error) throw new Error(j2.error.message || 'The provider returned an error.');
      var c = j2.choices && j2.choices[0] && j2.choices[0].delta && j2.choices[0].delta.content;
      if (c) onDelta(c);
    }
  }
}

async function claudeClient() {
  if (!AI_KEYS.claude) throw new Error('Add your Anthropic API key in Settings → AI assistant.');
  if (!AnthropicSDK) {
    try { AnthropicSDK = (await import(CLAUDE_SDK_URL)).default; }
    catch (e) { throw new Error('Couldn’t load the Anthropic SDK from the CDN (offline?).'); }
  }
  return new AnthropicSDK({ apiKey: AI_KEYS.claude, dangerouslyAllowBrowser: true });
}
function claudeError(e) {
  var A = AnthropicSDK;
  if (!A || !(e instanceof A.APIError)) return e;
  if (e instanceof A.AuthenticationError) return new Error('Anthropic rejected the API key.');
  if (e instanceof A.PermissionDeniedError) return new Error('This key can’t use that model.');
  if (e instanceof A.NotFoundError) return new Error('Model not found. Pick one with “Load models”.');
  if (e instanceof A.RateLimitError) return new Error('Rate limited. Try again in a moment.');
  if (e instanceof A.BadRequestError) return new Error('Request rejected: ' + e.message);
  if (e instanceof A.APIConnectionError) return new Error('Couldn’t reach the Anthropic API.');
  return new Error('Anthropic API error ' + (e.status || '') + ': ' + e.message);
}
async function streamClaude(messages, system, onDelta, signal) {
  var client = await claudeClient();
  var model = S.ai.claudeModel || 'claude-opus-5-5';
  var params = { model: model, max_tokens: 64000, system: system, messages: messages };
  var stream;
  try {
    if (CLAUDE_FALLBACK_MODELS.indexOf(model) >= 0) {
      // Server-side refusal fallback: if a safety classifier declines, the API retries on a suitable model.
      params.betas = ['server-side-fallback-2026-07-01']; params.fallbacks = 'default';
      stream = client.beta.messages.stream(params, { signal: signal });
    } else {
      stream = client.messages.stream(params, { signal: signal });
    }
    stream.on('text', function (delta) { onDelta(delta); });
    var final = await stream.finalMessage();
    if (final.stop_reason === 'refusal') throw new Error('Claude declined to answer that' + (final.stop_details && final.stop_details.category ? ' (' + final.stop_details.category + ')' : '') + '.');
    if (final.stop_reason === 'max_tokens') onDelta('\n\n(The answer was cut off.)');
  } catch (e) { throw claudeError(e); }
}

async function listModels() {
  if (S.ai.provider === 'claude') {
    var client = await claudeClient(), ids = [];
    try { for await (var m of client.models.list()) ids.push(m.id); } catch (e) { throw claudeError(e); }
    return ids;
  }
  var base = (S.ai.oaBase || '').replace(/\/+$/, ''), headers = {};
  if (AI_KEYS.openai) headers.Authorization = 'Bearer ' + AI_KEYS.openai;
  var res;
  try { res = await fetch(base + '/models', { headers: headers }); }
  catch (e) { throw new Error('Couldn’t reach ' + hostOf(base) + ' (offline, wrong URL, or the server blocks browser requests).'); }
  if (!res.ok) throw new Error(res.status === 401 ? 'The API key was rejected.' : 'Error ' + res.status + ' listing models.');
  var j = await res.json();
  return (j.data || j.models || []).map(function (m) { return m.id || m.name; }).filter(Boolean).sort();
}

async function llmAsk(q) {
  var msg = { me: false, llm: true, live: true, plain: '', src: [aiLabel(), 'Skyline data for ' + S.loc.name] };
  chat.push({ me: true, text: q }, msg);
  var history = chatHistory();
  renderChat();
  var ctrl = new AbortController(); aiAbort = ctrl;
  var pending = false;
  var paint = function () {
    pending = false;
    var el = document.querySelector('#chat .msg.ai.live .body');
    if (el) el.innerHTML = mdLite(msg.plain);
  };
  var onDelta = function (d) { msg.plain += d; if (!pending) { pending = true; requestAnimationFrame(paint); } };
  try {
    var system = skylineContext();
    if (S.ai.provider === 'claude') await streamClaude(history, system, onDelta, ctrl.signal);
    else await streamOpenAI(history, system, onDelta, ctrl.signal);
    if (!msg.plain.trim()) msg.plain = '(No answer came back.)';
  } catch (e) {
    if (e && e.name === 'AbortError') msg.plain += (msg.plain ? '\n\n' : '') + '(Stopped.)';
    else { msg.error = (e && e.message) || String(e); }
  }
  msg.live = false; aiAbort = null;
  renderChat();
}

   ============================================================ */
function route() {
  var h = decodeURIComponent(location.hash.slice(1)) || 'home';
  var parts = h.split('/');
  var page = parts[0] === 'stats' ? 'home' : parts[0];
  if (['home', 'predictions', 'ask', 'settings'].indexOf(page) < 0) page = 'home';
  return { page: page, sub: parts[1] || '', stats: parts[0] === 'stats' };
}
function render() {
  var r = route(), key = r.page + '/' + r.sub;
  document.body.dataset.page = r.page;
  var app = $('#app');
  destroyLive();
  app.innerHTML = r.page === 'home' ? homeView() : r.page === 'predictions' ? predView(r.sub) : r.page === 'ask' ? askView() : settingsView();
  document.querySelectorAll('[data-nav]').forEach(function (a) {
    if (a.dataset.nav === r.page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (r.page === 'home' && S.bgMode === 'live') SkyFX.start($('.hero'), S.weather, !!S.reduceMotion || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches));
  else SkyFX.stop();
  if (r.page === 'predictions' && r.sub) updatePred();
  if (r.page === 'ask' && pendingAsk) { var pq = pendingAsk; pendingAsk = null; ask(pq); }
  document.documentElement.lang = S.lang === 'zh' ? 'zh-Hant-TW' : 'en';
  document.title = { home: S.loc.name + ' · Skyline', predictions: 'Predictions · Skyline', ask: 'Ask AI · Skyline', settings: 'Settings · Skyline' }[r.page];
  if (key !== lastRoute) {
    if (r.stats) { var st = $('#stats'); if (st) st.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }
  lastRoute = key;
}
function selectorFor(el) {
  if (!el || el === document.body) return null;
  if (el.id) return '#' + el.id;
  if (el.dataset && el.dataset.action) {
    var s = '[data-action="' + el.dataset.action + '"]';
    ['key', 'val', 'id', 'base'].forEach(function (k) { if (el.dataset[k] != null) s += '[data-' + k + '="' + el.dataset[k] + '"]'; });
    return s;
  }
  return null;
}
function rerender() {
  var sel = selectorFor(document.activeElement);
  render();
  if (sel) { var el = document.querySelector(sel); if (el && !el.disabled) el.focus({ preventScroll: true }); }
}
function rerenderStats(focusSel) {
  var st = $('#stats'); if (!st) return;
  st.innerHTML = statsInner();
  if (focusSel) { var el = document.querySelector(focusSel); if (el && !el.disabled) el.focus({ preventScroll: true }); else { var g = $('#grid .edit-ctl button'); if (g) g.focus({ preventScroll: true }); } }
}

/* ============================================================
   Location search
   Accepts: place names (EN / 中文), decimal or DMS coordinates,
   IATA (3-letter) and ICAO (4-letter) airport codes, universities.
   ============================================================ */
var results = [], active = -1, lastFocus = null, wwSeq = 0;

function parseCoords(q) {
  var s = q.replace(/\b(lat(itude)?|lon(gitude)?|lng)\b\s*[:=]?/gi, ' ').replace(/[()\[\]]/g, ' ').trim();
  if (!/\d/.test(s)) return null;
  var re = /([+-]?\d+(?:\.\d+)?)\s*(?:°|º|d|deg)?\s*(?:(\d+(?:\.\d+)?)\s*(?:'|′|’|m)\s*)?(?:(\d+(?:\.\d+)?)\s*(?:"|″|”|''|s)\s*)?\s*([NSEW])?/gi;
  var parts = [], m, rest = s;
  while ((m = re.exec(s)) !== null) {
    if (m[0].trim() === '') { re.lastIndex++; continue; }
    parts.push(m);
    rest = rest.replace(m[0], ' ');
  }
  if (parts.length !== 2) return null;
  if (rest.replace(/[\s,;\/]+/g, '') !== '') return null;
  var vals = parts.map(function (p) {
    var v = Math.abs(parseFloat(p[1])) + (p[2] ? parseFloat(p[2]) / 60 : 0) + (p[3] ? parseFloat(p[3]) / 3600 : 0);
    var neg = /^-/.test(p[1]) || /[SW]/i.test(p[4] || '');
    return { v: neg ? -v : v, h: (p[4] || '').toUpperCase() };
  });
  var lat = vals[0], lon = vals[1];
  if (/[EW]/.test(lat.h) || /[NS]/.test(lon.h)) { var tmp = lat; lat = lon; lon = tmp; }
  if (!isFinite(lat.v) || !isFinite(lon.v) || Math.abs(lat.v) > 90 || Math.abs(lon.v) > 180) return null;
  return { lat: lat.v, lon: lon.v };
}

function textScore(p, nq) {
  var best = 0;
  p.keys.forEach(function (a) {
    if (a === nq) best = Math.max(best, 100);
    else if (a.indexOf(nq) === 0) best = Math.max(best, 70);
    else if (a.split(' ').some(function (w) { return w.indexOf(nq) === 0; })) best = Math.max(best, 55);
    else if (nq.length >= 2 && a.indexOf(nq) >= 0) best = Math.max(best, 35);
  });
  // multi-word queries: every word must appear somewhere
  if (!best && nq.indexOf(' ') > 0) {
    var all = p.keys.join(' ');
    if (nq.split(' ').every(function (w) { return all.indexOf(w) >= 0; })) best = 40;
  }
  if (best && p.kind === 'City') best += 3;
  return best;
}

function search(q) {
  var out = [], seen = {};
  var push = function (r) { var key = r.id || (r.lat.toFixed(4) + ',' + r.lon.toFixed(4)); if (seen[key]) return; seen[key] = true; out.push(r); };
  var c = parseCoords(q);
  if (c) {
    var al = autoLoc(c.lat, c.lon, 'Coordinates', fmtCoord(c.lat, c.lon));
    push({ kind: 'Coordinates', tag: 'coords', name: fmtCoord(c.lat, c.lon), sub: al.name === fmtCoord(c.lat, c.lon) ? (al.sub === 'Coordinates' ? 'Point forecast from Windy' : al.sub) : al.name + ' · ' + al.sub.split(' · ').slice(0, 2).join(' · '), lat: c.lat, lon: c.lon, loc: al });
    return out;
  }
  // Taiwan postal codes: 408, 40852, 408052, or an address that starts with one (408台中市南屯區…)
  var pm = /^\s*(\d{3})(?:\d{2,3})?(?!\d)\s*(.*)$/.exec(q);
  if (pm) {
    var rest = norm(pm[2] || '');
    var hits = PLACES.filter(function (p) { return p.postal === pm[1]; });
    if (rest) {
      var narrowed = hits.filter(function (p) { return textScore(p, rest) > 0 || p.keys.some(function (k) { return rest.indexOf(k) >= 0 && k.length > 1 && !/^\d+$/.test(k); }); });
      if (narrowed.length) hits = narrowed;
    }
    hits.forEach(function (p) { push(districtResult(p, true)); });
    if (!hits.length) out.push({ note: 'No Taiwan district has postal code ' + pm[1] + '.' });
    return out;
  }
  var code = q.trim().toUpperCase();
  var codeNote = null;
  if (/^[A-Z]{3}$/.test(code)) {
    var a3 = PLACES.filter(function (p) { return p.iata === code; })[0];
    if (a3) push(airportResult(a3, 'IATA'));
    else codeNote = 'No airport with IATA code ' + code + ' in the offline list.';
  } else if (/^[A-Z]{4}$/.test(code)) {
    var a4 = PLACES.filter(function (p) { return p.icao === code; })[0];
    if (a4) push(airportResult(a4, 'ICAO'));
    else codeNote = 'No airport with ICAO code ' + code + ' in the offline list.';
  }
