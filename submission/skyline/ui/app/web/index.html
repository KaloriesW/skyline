<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyline · Taiwan Landslide Review</title>
<meta name="description" content="Skyline and Terrain Watch: review Taiwan satellite landslide candidates with coordinates, before-and-after imagery, local Qwen, weather and air-quality context.">
<meta name="theme-color" content="#0B1B3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skyline">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-maskable.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ?v= forces a fresh copy: Cloudflare lets browsers cache .js/.css for 4 hours. Bump it on each deploy. -->
<link rel="stylesheet" href="styles.css?v=terrain-glass-v10">
<link rel="stylesheet" href="/static/workspace.css?v=2"><link rel="stylesheet" href="field-desk.css?v=3"></head>
<body data-page="home" data-mood="neutral" data-day="1">
<!-- Sky behind every screen: mood gradient, haze and the effects canvas (sky.js) -->
<div id="sky" aria-hidden="true">
  <div class="sky-grad"></div>
  <div class="sky-haze"></div>
  <canvas id="fx"></canvas>
  <div class="sky-dim"></div>
</div>
<!-- Shared SVG definitions for maps -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="sk-windy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2D4F8E"/><stop offset="0.5" stop-color="#2F7A8E"/><stop offset="1" stop-color="#3B5FA0"/></linearGradient>
    <filter id="sk-b16" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
</svg>

<header class="topbar" id="topbar">
  <a class="brand" href="#home" data-action="go-home" aria-label="Skyline home"><span class="brand-dot" aria-hidden="true"></span>Skyline</a>
  <nav class="topnav" aria-label="Main">
    <a href="#home" data-nav="home" data-action="go-home">Home</a>
    <a href="#predictions" data-nav="predictions">Predictions</a>
    <a href="#ask" data-workspace-qwen>Ask Qwen</a><a href="/terrain/">Landslide map ↗</a>
    <a href="#settings" data-nav="settings">Settings</a>
  </nav>
  <div class="compact" id="compact" aria-hidden="true"><b id="compactPlace"></b><span class="c2"><span id="compactTemp"></span><i class="sep">|</i><span id="compactCond"></span></span></div>
  <div class="top-actions">
    <button type="button" class="search-btn" data-action="open-search" aria-keyshortcuts="Meta+K Control+K /" aria-label="Search for a location">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sb-text">Search</span><kbd>⌘K</kbd>
    </button>
    <button type="button" class="round-btn home-only" id="editBtn" data-action="edit-widgets" title="Edit widgets" aria-label="Edit widgets" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
    </button>
    <button type="button" class="round-btn plus home-only" id="addBtn" data-action="add-widget" title="Add widget" aria-label="Add widget">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<div class="edit-bar" id="editBar">
  <span class="edit-tip">Drag widgets to rearrange · tap − to remove</span>
  <button type="button" class="text-btn" data-action="reset-widgets">Reset</button>
  <button type="button" class="pill-btn" data-action="done-widgets">Done</button>
</div>

<main id="app"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#home" data-nav="home" data-action="go-home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#predictions" data-nav="predictions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Predictions</a>
  <a href="/terrain/?assistant=1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>Ask Qwen</a>
  <a href="#settings" data-nav="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
</nav>

<div class="search-overlay" id="search" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
    <h2 id="search-title" class="sr-only">Search for a location</h2>
    <div class="search-field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" class="sr-only">Place, coordinates, airport code or university</label>
      <input id="q" type="search" data-input="q" autocomplete="off" spellcheck="false"
        placeholder="City, district, postal code, 25.03, 121.56, TPE, or a university"
        role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list">
      <button type="button" class="close" data-action="close-search">Esc</button>
    </div>
    <div class="search-body" id="search-body"></div>
    <div class="s-actions">
      <button type="button" data-action="geolocate"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Use my location</button><p class="hint" role="status" data-location-status>Location access is optional. You can search for a city instead.</p>
      <button type="button" data-action="worldwide" id="ww-btn" hidden></button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div>
</div>

<div class="pop-backdrop" id="popBackdrop" hidden></div>
<div class="pop" id="pop" role="dialog" aria-label="Details" hidden><i class="pop-arrow" aria-hidden="true"></i><div class="pop-scroll" id="popBody"></div></div>
<aside class="map-panel" id="mapPanel" aria-label="Map" hidden></aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="icons.js?v=terrain-glass-v10"></script>
<script src="sky.js?v=terrain-glass-v10"></script>
<script src="horizon.js?v=terrain-glass-v10"></script>
<script src="location.js?v=1"></script>
<script src="/static/workspace.js?v=1"></script><script src="/static/monitor-ui.js?v=1"></script>
<script src="app.js?v=terrain-glass-v10"></script>
</body>
</html>
